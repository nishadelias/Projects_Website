<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="RISC-V CPU Simulator pipeline diagram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="600">RISC-V CPU Simulator</text>
  <text x="320" y="72" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">5-Stage Pipeline</text>

  <!-- Pipeline stages -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="600">
    <rect x="40" y="130" width="90" height="48" rx="6" fill="url(#stage)" stroke="#475569"/>
    <text x="85" y="159" text-anchor="middle" fill="#e2e8f0">IF</text>

    <rect x="150" y="130" width="90" height="48" rx="6" fill="url(#stage)" stroke="#475569"/>
    <text x="195" y="159" text-anchor="middle" fill="#e2e8f0">ID</text>

    <rect x="260" y="130" width="90" height="48" rx="6" fill="url(#stage)" stroke="#475569"/>
    <text x="305" y="159" text-anchor="middle" fill="#e2e8f0">EX</text>

    <rect x="370" y="130" width="90" height="48" rx="6" fill="url(#stage)" stroke="#475569"/>
    <text x="415" y="159" text-anchor="middle" fill="#e2e8f0">MEM</text>

    <rect x="480" y="130" width="90" height="48" rx="6" fill="url(#stage)" stroke="#475569"/>
    <text x="525" y="159" text-anchor="middle" fill="#e2e8f0">WB</text>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="154" x2="150" y2="154"/>
    <line x1="240" y1="154" x2="260" y2="154"/>
    <line x1="350" y1="154" x2="370" y2="154"/>
    <line x1="460" y1="154" x2="480" y2="154"/>
  </g>

  <!-- Branch predictor -->
  <rect x="150" y="220" width="140" height="36" rx="6" fill="#1d4ed8" fill-opacity="0.25" stroke="#3b82f6"/>
  <text x="220" y="242" text-anchor="middle" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="12">Branch Predictor</text>
  <line x1="195" y1="178" x2="195" y2="220" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Cache -->
  <rect x="370" y="220" width="140" height="36" rx="6" fill="#059669" fill-opacity="0.25" stroke="#10b981"/>
  <text x="440" y="242" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12">Cache ’ 64 KiB RAM</text>
  <line x1="415" y1="178" x2="415" y2="220" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>

  <text x="320" y="310" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Cycle-accurate RV32 teaching simulator</text>
</svg>
