<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="FPGA Flappy Bird VGA game diagram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="600">FPGA Flappy Bird</text>
  <text x="320" y="72" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Basys3 · VGA 640×480</text>

  <!-- VGA monitor frame -->
  <rect x="120" y="95" width="400" height="200" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="132" y="107" width="376" height="176" rx="4" fill="url(#screen)"/>

  <!-- Pillar gap -->
  <rect x="380" y="107" width="36" height="70" fill="#166534"/>
  <rect x="380" y="197" width="36" height="86" fill="#166534"/>

  <!-- Bird -->
  <circle cx="260" cy="175" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="274,175 290,170 290,180" fill="#f59e0b"/>

  <!-- Score on 7-seg hint -->
  <rect x="148" y="118" width="48" height="20" rx="3" fill="#0f172a" stroke="#334155"/>
  <text x="172" y="132" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="11">042</text>

  <!-- FPGA board block -->
  <rect x="200" y="310" width="240" height="32" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="320" y="330" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Basys3 FPGA</text>
  <line x1="280" y1="295" x2="280" y2="310" stroke="#64748b" stroke-width="1.5"/>
  <line x1="360" y1="295" x2="360" y2="310" stroke="#64748b" stroke-width="1.5"/>

  <text x="320" y="355" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Verilog game logic with VGA output and 7-segment score</text>
</svg>
