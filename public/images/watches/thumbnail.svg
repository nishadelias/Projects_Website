<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Custom watches collection">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="case" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <radialGradient id="dial" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="600">Custom Watches</text>
  <text x="320" y="72" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Hand-built timepieces</text>

  <!-- Watch 1 -->
  <g transform="translate(120, 170)">
    <rect x="-8" y="-78" width="16" height="28" rx="4" fill="#475569"/>
    <rect x="-8" y="50" width="16" height="28" rx="4" fill="#475569"/>
    <circle r="52" fill="url(#case)"/>
    <circle r="42" fill="url(#dial)"/>
    <circle r="3" fill="#0f172a"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="10" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Watch 2 -->
  <g transform="translate(320, 170)">
    <rect x="-8" y="-78" width="16" height="28" rx="4" fill="#475569"/>
    <rect x="-8" y="50" width="16" height="28" rx="4" fill="#475569"/>
    <circle r="52" fill="url(#case)"/>
    <circle r="42" fill="url(#dial)"/>
    <circle r="3" fill="#0f172a"/>
    <line x1="0" y1="0" x2="-12" y2="-22" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="-4" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Watch 3 -->
  <g transform="translate(520, 170)">
    <rect x="-8" y="-78" width="16" height="28" rx="4" fill="#475569"/>
    <rect x="-8" y="50" width="16" height="28" rx="4" fill="#475569"/>
    <circle r="52" fill="url(#case)"/>
    <circle r="42" fill="url(#dial)"/>
    <circle r="3" fill="#0f172a"/>
    <line x1="0" y1="0" x2="8" y2="-28" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-20" y2="8" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="320" y="330" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Three custom builds with photos, video, and write-ups</text>
</svg>
