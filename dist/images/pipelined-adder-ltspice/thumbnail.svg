<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="2-stage pipelined CMOS adder diagram">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="block" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="reg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <text x="320" y="48" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="600">2-Stage Pipelined CMOS Adder</text>
  <text x="320" y="72" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">LTspice · TSMC 0.18 µm</text>

  <!-- Inputs -->
  <text x="48" y="158" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">A, B</text>
  <line x1="68" y1="154" x2="100" y2="154" stroke="#64748b" stroke-width="2"/>

  <!-- Stage 1 -->
  <rect x="100" y="120" width="120" height="68" rx="6" fill="url(#block)" stroke="#475569"/>
  <text x="160" y="148" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Stage 1</text>
  <text x="160" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sum / Carry Logic</text>

  <!-- Pipeline register -->
  <rect x="250" y="132" width="56" height="44" rx="4" fill="url(#reg)" stroke="#3b82f6"/>
  <text x="278" y="158" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FF</text>

  <!-- Stage 2 -->
  <rect x="336" y="120" width="120" height="68" rx="6" fill="url(#block)" stroke="#475569"/>
  <text x="396" y="148" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Stage 2</text>
  <text x="396" y="168" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Sum / Carry Logic</text>

  <!-- Output register -->
  <rect x="486" y="132" width="56" height="44" rx="4" fill="url(#reg)" stroke="#3b82f6"/>
  <text x="514" y="158" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FF</text>

  <!-- Arrows -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="220" y1="154" x2="250" y2="154"/>
    <line x1="306" y1="154" x2="336" y2="154"/>
    <line x1="456" y1="154" x2="486" y2="154"/>
    <line x1="542" y1="154" x2="572" y2="154"/>
  </g>
  <text x="592" y="158" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">S, C</text>

  <!-- Clock -->
  <text x="320" y="230" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CLK ~ 1.67 GHz</text>
  <line x1="278" y1="210" x2="278" y2="218" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="514" y1="210" x2="514" y2="218" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 2"/>

  <text x="320" y="300" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Transistor-level 2-bit ripple-carry adder with pipeline registers</text>
</svg>
